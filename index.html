<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected World Travel Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f8ff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #555; margin-bottom: 20px; }
        .controls { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
            display: inline-block; 
        }
        input, select, button { 
            padding: 10px; 
            margin: 5px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
        }
        button { 
            background-color: #3498db; 
            color: white; 
            border: none; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        button:hover { background-color: #2980b9; }
        #map-wrapper { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: inline-block; 
        }
        #map { 
            height: 500px; 
            width: 800px; 
            border-radius: 5px; 
            background-color: #e5e3df;
        }
        .btn-download { 
            background-color: #27ae60; 
            margin-top: 15px; 
            width: 100%;
            font-weight: bold;
        }
        .btn-download:hover { background-color: #2ecc71; }
    </style>
</head>
<body>
    <h1>🗺️ Connected World Travel Map</h1>
    <p>Map transport connections between India, the UAE, and France!</p>
    
    <div class="controls">
        <input type="text" id="fromCity" placeholder="From City (e.g., Paris)" />
        <input type="text" id="toCity" placeholder="To City (e.g., Dubai)" />
        <select id="transportMode">
            <option value="airway">✈️ Airway</option>
            <option value="waterway">🚢 Waterway</option>
            <option value="road">🚗 Road</option>
            <option value="railway">🚂 Railway</option>
        </select>
        <button id="addBtn" onclick="addRoute()">Add Route</button>
    </div>

    <br>

    <div id="map-wrapper">
        <div id="map"></div>
        <button class="btn-download" onclick="downloadMap()">📥 Download Map</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // Initialize map centered roughly between France, UAE, and India
        const map = L.map('map').setView([24.0, 54.0], 3);

        // GOOGLE MAPS TILE LAYER (hl=en forces English labels)
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=en', {
            maxZoom: 19,
            attribution: '© Google Maps',
            crossOrigin: true 
        }).addTo(map);

        // Geocoding using Open-Meteo (Fast, Free, No API Key, No strict blocks)
        async function getCoordinates(city) {
            try {
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                const data = await response.json();
                if (data && data.results && data.results.length > 0) {
                    return [parseFloat(data.results[0].latitude), parseFloat(data.results[0].longitude)];
                }
                return null;
            } catch (error) {
                console.error("Error fetching coordinates:", error);
                return null;
            }
        }

        const styles = {
            airway: { color: '#e74c3c', dashArray: '5, 5', weight: 4 },
            waterway: { color: '#3498db', dashArray: '2, 6', weight: 4 },
            road: { color: '#7f8c8d', dashArray: '', weight: 4 },
            railway: { color: '#2c3e50', dashArray: '15, 10', weight: 5 }
        };

        async function addRoute() {
            const fromCity = document.getElementById('fromCity').value.trim();
            const toCity = document.getElementById('toCity').value.trim();
            const mode = document.getElementById('transportMode').value;
            const btn = document.getElementById('addBtn');

            if (!fromCity || !toCity) {
                alert('Please enter both cities!');
                return;
            }

            btn.innerText = "Finding cities...";
            btn.disabled = true;

            const fromCoords = await getCoordinates(fromCity);
            const toCoords = await getCoordinates(toCity);

            btn.innerText = "Add Route";
            btn.disabled = false;

            if (!fromCoords || !toCoords) {
                alert('Could not find coordinates for one or both cities. Check spelling and try again.');
                return;
            }

            L.marker(fromCoords).addTo(map).bindPopup(`<b>${fromCity}</b>`).openPopup();
            L.marker(toCoords).addTo(map).bindPopup(`<b>${toCity}</b>`);

            const routeStyle = styles[mode];
            const polyline = L.polyline([fromCoords, toCoords], routeStyle).addTo(map);
            
            map.fitBounds(polyline.getBounds(), { padding: [50, 50], maxZoom: 5 });
        }

        function downloadMap() {
            const mapElement = document.getElementById('map-wrapper');
            
            html2canvas(mapElement, {
                useCORS: true, 
                allowTaint: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Connected-World-Map.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert("Download blocked. Please open this file using a local web server (like Netlify Drop or VS Code Live Server).");
                console.error(err);
            });
        }
    </script>
</body>
</html>
